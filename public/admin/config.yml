backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "admissions"
    label: "Admissions"
    files:
      - name: "admissions"
        label: "Admissions Content"
        file: "data/admissions.json"
        fields:
          - label: "Admission Process Steps"
            name: "process"
            widget: "list"
            fields:
              - { label: "Step Number", name: "step", widget: "number" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Requirements"
            name: "requirements"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - label: "Free SHS Benefits"
            name: "freeShs"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - label: "Optional Services"
            name: "optionalServices"
            widget: "list"
            fields:
              - { label: "Service", name: "service", widget: "string" }
              - { label: "Fee", name: "fee", widget: "string" }
          - label: "Continuing Student Fees"
            name: "continuingStudentFees"
            widget: "object"
            fields:
              - { label: "Note", name: "note", widget: "text" }
              - label: "Fee Rows"
                name: "rows"
                widget: "list"
                fields:
                  - { label: "Programme", name: "programme", widget: "string" }
                  - { label: "Day Fee", name: "day", widget: "string" }
                  - { label: "Hostel Fee", name: "hostel", widget: "string" }
          - label: "Prospectus Downloads"
            name: "downloads"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "PDF Link", name: "href", widget: "string" }
          - label: "Key Dates"
            name: "keyDates"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: "photos"
    label: "Key Photos"
    files:
      - name: "stock-images"
        label: "Site Photos"
        file: "data/stock-images.json"
        fields:
          - { label: "Campus", name: "Campus", widget: "image" }
          - { label: "Administration Block", name: "Administration Block", widget: "image" }
          - { label: "Classrooms", name: "Classrooms", widget: "image" }
          - { label: "Students", name: "Students", widget: "image" }
          - { label: "Teachers", name: "Teachers", widget: "image" }
          - { label: "Library", name: "Library", widget: "image" }
          - { label: "Computer Lab", name: "Computer Lab", widget: "image" }
          - { label: "Science Lab", name: "Science Lab", widget: "image" }
          - { label: "Hostel", name: "Hostel", widget: "image" }
          - { label: "Sports", name: "Sports", widget: "image" }
          - { label: "Graduation", name: "Graduation", widget: "image" }
          - { label: "School Bus", name: "School Bus", widget: "image" }
          - { label: "Events", name: "Events", widget: "image" }

  - name: "staff"
    label: "Staff"
    files:
      - name: "staff"
        label: "Staff Members"
        file: "data/senior-high/staff.json"
        fields:
          - label: "Staff"
            name: "staff"
            widget: "list"
            summary: "{{fields.name}} — {{fields.position}}"
            fields:
              - { label: "Unique ID", name: "id", widget: "string", hint: "A short unique name, e.g. shs-headmaster. Not shown on the site." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Position", name: "position", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - label: "Photo Category"
                name: "imageCategory"
                widget: "select"
                hint: "Used only if no photo is set above."
                options:
                  ["Campus", "Students", "Events", "Sports", "Classrooms", "Computer Lab", "Graduation", "Hostel", "Teachers", "Library", "Science Lab", "School Bus"]
              - { label: "Bio", name: "bio", widget: "text", required: false }

  - name: "news"
    label: "News"
    files:
      - name: "news"
        label: "News Articles"
        file: "data/senior-high/news.json"
        fields:
          - label: "Articles"
            name: "news"
            widget: "list"
            summary: "{{fields.publishedAt}} — {{fields.title}}"
            fields:
              - { label: "Unique ID", name: "id", widget: "string", hint: "A short unique name, e.g. shs-news-3. Not shown on the site." }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in the article's web address, e.g. shs-computer-lab-upgrade." }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - label: "Photo Category"
                name: "imageCategory"
                widget: "select"
                hint: "Used only if no photo is set above."
                options:
                  ["Campus", "Students", "Events", "Sports", "Classrooms", "Computer Lab", "Graduation", "Hostel", "Teachers", "Library", "Science Lab", "School Bus"]
              - { label: "Summary", name: "summary", widget: "text", hint: "Short teaser shown on news cards." }
              - { label: "Body", name: "body", widget: "text", hint: "Full article content." }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Published Date", name: "publishedAt", widget: "date", format: "YYYY-MM-DD" }

  - name: "gallery"
    label: "Gallery"
    files:
      - name: "gallery"
        label: "Gallery Photos"
        file: "data/senior-high/gallery.json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.imageCategory}} — {{fields.caption}}"
            fields:
              - { label: "Unique ID", name: "id", widget: "string", hint: "A short unique name, e.g. campus-4. Not shown on the site." }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - label: "Category"
                name: "imageCategory"
                widget: "select"
                options:
                  ["Campus", "Students", "Events", "Sports", "Classrooms", "Computer Lab", "Graduation", "Hostel"]
              - { label: "Caption", name: "caption", widget: "string" }
